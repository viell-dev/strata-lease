[package]
name = "strata-lease"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/viell-dev/strata-lease"
rust-version = "1.87.0"
description = "Revocable zero-copy sharing of retained byte buffers through promotable leases"
keywords = ["zero-copy", "buffer", "lease", "memory", "sharing"]
categories = ["data-structures", "memory-management"]
license = "MPL-2.0"
readme = "README.md"
include = [
  "src/lease.rs",
  "src/lease/tests.rs",
  "src/lib.rs",
  "src/span.rs",
  "src/span/tests.rs",
  "src/store.rs",
  "src/store/tests.rs",
  "tests/consumer.rs",
  "tests/hardening.rs",
  "benches/BASELINE.md",
  "benches/README.md",
  "benches/lease.rs",
  "benches/lease/access.rs",
  "benches/lease/churn.rs",
  "benches/lease/reclaim.rs",
  "benches/memory.rs",
  "benches/results.csv",
  "Cargo.toml",
  "Cargo.lock",
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "LICENSE",
  "LICENSE-CLARIFICATION.md",
  "LICENSE-MIT-0",
  "README.md",
  "rust-toolchain.toml",
]

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "lease"
harness = false

[[bench]]
name = "memory"
harness = false

[lints.rust]
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
unused = { level = "warn", priority = -1 }

missing_docs = "warn"
unexpected_cfgs = "warn"
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_safety_doc = "allow"
must_use_candidate = "allow"
manual_div_ceil = "allow"

allow_attributes = "warn"
allow_attributes_without_reason = "warn"
arithmetic_side_effects = "warn"
as_conversions = "warn"
cfg_not_test = "warn"
expect_used = "warn"
indexing_slicing = "warn"
module_name_repetitions = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
